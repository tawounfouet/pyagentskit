  "/LICENSE",
  "/NOTICE",
  "/SECURITY.md",
  "/examples",
  "/evals",
  "/scripts",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyagentskit"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=pyagentskit --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pyagentskit"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
packages = ["pyagentskit"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
