apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyagentskit-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pyagentskit-worker
  template:
    metadata:
      labels:
        app: pyagentskit-worker
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: worker
          image: example.invalid/pyagentskit-worker:1.6.0
          env:
            - name: PYAGENTSKIT_WORKER_OWNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: PYAGENTSKIT_LEASE_TTL_SECONDS
              value: "30"
            - name: PYAGENTSKIT_RENEWAL_INTERVAL_SECONDS
              value: "10"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              httpGet:
                path: /internal/drain?timeout_seconds=75
                port: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pyagentskit-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pyagentskit-worker
