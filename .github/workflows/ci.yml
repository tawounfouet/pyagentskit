name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import pyagentskit; print(pyagentskit.__version__)"
      - run: python -m pip check
      - run: python -m pyagentskit doctor

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pyagentskit
          POSTGRES_PASSWORD: pyagentskit
          POSTGRES_DB: pyagentskit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyagentskit -d pyagentskit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYAGENTSKIT_LIVE_POSTGRES: I_ACCEPT_DATABASE_WRITES
      PYAGENTSKIT_POSTGRES_DSN: postgresql://pyagentskit:pyagentskit@localhost:5432/pyagentskit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,postgres]"
      - run: pytest -q tests/test_postgres_live_qualification.py
