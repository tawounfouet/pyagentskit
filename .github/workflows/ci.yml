name: CI

on:
  push:
    branches:
      - main
      - "remediation/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check src tests scripts examples
      - name: Typecheck
        run: python -m mypy src
      - name: Compile
        run: python -m compileall -q src

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit, property, architecture and contract tests
        run: python -m pytest -p pytest_cov -q -rs

  postgres-v2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pyagentskit
          POSTGRES_PASSWORD: pyagentskit
          POSTGRES_DB: pyagentskit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyagentskit -d pyagentskit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYAGENTSKIT_LIVE_POSTGRES: I_ACCEPT_DATABASE_WRITES
      PYAGENTSKIT_POSTGRES_DSN: postgresql://pyagentskit:pyagentskit@localhost:5432/pyagentskit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL qualification dependencies
        run: python -m pip install -e ".[dev,postgres]"
      - name: Qualify V2 PostgreSQL persistence
        run: python -m pytest -q tests/test_v2_postgres_live_qualification.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - name: Build
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: True fresh install
        shell: bash
        run: |
          python -m venv /tmp/pyagentskit-clean
          /tmp/pyagentskit-clean/bin/python -m pip install --upgrade pip
          /tmp/pyagentskit-clean/bin/pip install dist/pyagentskit-2.0.0a3-py3-none-any.whl
          /tmp/pyagentskit-clean/bin/python -c "import pyagentskit; assert pyagentskit.__version__ == '2.0.0a3'"
          /tmp/pyagentskit-clean/bin/python -c "from pyagentskit.domain import Effect, ReconciliationEvidence, RecoveryPlanner; assert Effect and ReconciliationEvidence and RecoveryPlanner"
          /tmp/pyagentskit-clean/bin/python -c "from pyagentskit.application import EffectExecutionGate, ReconcileEffect, RuntimeRecoveryExecutor; assert EffectExecutionGate and ReconcileEffect and RuntimeRecoveryExecutor"
          /tmp/pyagentskit-clean/bin/pip check
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: pyagentskit-2.0.0a3-dist
          path: dist/*
          if-no-files-found: error

  release-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install -e ".[dev]"
      - name: Reproducible release qualification
        run: python scripts/release_check.py
      - name: Upload qualified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyagentskit-2.0.0a3-release-qualified
          path: release-dist/*
          if-no-files-found: error
